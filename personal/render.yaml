# Blueprint for Millie's command centre only.
# Create a new Render blueprint and set its path to personal/render.yaml.
# Do not sync the repo root render.yaml: that file is the live organic service.
# Service name mailbakes-personal → https://mailbakes-personal.onrender.com
# If that hostname is taken, change name and APP_URL together.
services:
  - type: web
    name: mailbakes-personal
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: personal
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mailbakes-personal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: APP_NAME
        value: Millie
      - key: APP_URL
        value: https://mailbakes-personal.onrender.com
      - key: GMAIL_ADDRESS
        value: millie@mailbakes.com
      - key: FINANCE_EMAIL
        value: accounts@mailbakes.com
      - key: PAUL_EMAIL
        value: accounts@mailbakes.com
      - key: JESS_EMAIL
        value: operations@mailbakes.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional. Outlook / Hotmail inboxes. From an Azure app registration
      # (personal + work accounts) with redirect APP_URL/api/microsoft/callback.
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: PERSONAL_API_TOKEN
        sync: false
      # Optional. Blank means no extra supplier domains. Edit later to a comma-separated list.
      - key: SUPPLIER_DOMAINS
        value: ""
      - key: PERSONAL_CALENDAR_NAMES
        value: personal,home,private,family

  # Emails appointment reminders (7am on the day, 6pm the day before).
  # It only calls the web service; the web service does the sending.
  - type: cron
    name: mailbakes-personal-reminders
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: personal
    schedule: "*/15 * * * *"
    buildCommand: echo "nothing to build"
    startCommand: node scripts/send-reminders.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://personal.mailbakes.com
      # Same value as PERSONAL_API_TOKEN on the web service. Set by hand, because
      # the live web service may not be named mailbakes-personal.
      - key: PERSONAL_API_TOKEN
        sync: false

databases:
  - name: mailbakes-personal-db
    databaseName: mailbakes_personal
    user: mailbakes
    plan: basic-256mb
    region: frankfurt
