# Render Blueprint for MailBakes organic social planning.
# Service name mailbakes-organic → https://mailbakes-organic.onrender.com
services:
  - type: web
    name: mailbakes-organic
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mailbakes-organic-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MANAGEMENT_NAME
        value: Millie
      - key: TEAM_NAME
        value: Content team
      - key: SEED_SAMPLE_CONTENT
        value: "false"
      - key: MANAGEMENT_EMAIL
        sync: false
      - key: MANAGEMENT_PASSWORD
        sync: false
      - key: TEAM_EMAIL
        sync: false
      - key: TEAM_PASSWORD
        sync: false

databases:
  - name: mailbakes-organic-db
    databaseName: mailbakes
    user: mailbakes
    plan: basic-256mb
    region: frankfurt
