# Render Blueprint for MailBakes.
# mailbakes-organic → https://mailbakes-organic.onrender.com
# mailbakes-personal → https://mailbakes-personal.onrender.com
# If mailbakes-personal is taken, rename that service and its APP_URL together.
services:
  - type: web
    name: mailbakes-organic
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mailbakes-organic-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MANAGEMENT_NAME
        value: Millie
      - key: TEAM_NAME
        value: Content team
      - key: SEED_SAMPLE_CONTENT
        value: "false"
      - key: MANAGEMENT_EMAIL
        sync: false
      - key: MANAGEMENT_PASSWORD
        sync: false
      - key: TEAM_EMAIL
        sync: false
      - key: TEAM_PASSWORD
        sync: false
      - key: APP_URL
        value: https://mailbakes-organic.onrender.com
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: SNAPCHAT_CLIENT_ID
        sync: false
      - key: SNAPCHAT_CLIENT_SECRET
        sync: false

  - type: web
    name: mailbakes-personal
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: personal
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mailbakes-personal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: APP_NAME
        value: Millie
      - key: APP_URL
        value: https://mailbakes-personal.onrender.com
      - key: GMAIL_ADDRESS
        value: millie@mailbakes.com
      - key: FINANCE_EMAIL
        value: accounts@mailbakes.com
      - key: PAUL_EMAIL
        value: accounts@mailbakes.com
      - key: JESS_EMAIL
        value: operations@mailbakes.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PERSONAL_API_TOKEN
        sync: false
      - key: SUPPLIER_DOMAINS
        sync: false
      - key: PERSONAL_CALENDAR_NAMES
        value: personal,home,private,family

databases:
  - name: mailbakes-organic-db
    databaseName: mailbakes
    user: mailbakes
    plan: basic-256mb
    region: frankfurt
  - name: mailbakes-personal-db
    databaseName: mailbakes_personal
    user: mailbakes
    plan: basic-256mb
    region: frankfurt
